# Render Blueprint for the VisionGuard API (backend/).
# Values marked "sync: false" are secrets you type into the Render dashboard.
services:
  - type: web
    name: visionguard-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: VISION_SERVICE_URL
        sync: false
      - key: VISION_API_KEY
        sync: false
      - key: VISION_TIMEOUT_MS
        value: "15000"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-southeast-2
      - key: AWS_S3_BUCKET
        value: aniket-detection-console
